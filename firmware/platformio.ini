; Firmware del nodo ESP32 (un único binario para todos los nodos).
; La identidad (MAC), la red y las credenciales MQTT viven en NVS y se
; cargan por USB con el comando "provision": no hace falta recompilar
; para mover o renombrar un nodo.

[platformio]
src_dir = esp32_node

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@^7.2.0
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
