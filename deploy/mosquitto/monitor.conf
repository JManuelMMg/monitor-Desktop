# /etc/mosquitto/conf.d/monitor.conf  — Eclipse Mosquitto 2.x (paquete apt)

per_listener_settings false
allow_anonymous false
# Lo genera el backend (app/mqtt_auth.py) a partir de la base de datos; no editar a mano.
password_file /var/lib/monitor-mqtt/passwd
acl_file /etc/mosquitto/acl

# El clientId se fuerza igual al usuario (la MAC): un nodo no puede
# hacerse pasar por otro ni expulsarlo usando su clientId.
use_username_as_clientid true

max_packet_size 8192
max_inflight_messages 20
max_queued_messages 500
persistent_client_expiration 7d

# Solo el backend local, sin TLS, nunca expuesto a la red.
listener 1883 127.0.0.1

# Nodos ESP32 por la LAN, siempre TLS. El firewall limita este puerto a la LAN.
listener 8883
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
cafile /etc/mosquitto/certs/ca.crt
tls_version tlsv1.2
